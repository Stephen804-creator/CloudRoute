name: CI

on:
  push:
    branches:
      - main
      - unit-1-foundation
      - build/units-2-7
      - build/unit-8-gcp
      - build/units-9-12
  pull_request:
    branches:
      - main
      - build/units-2-7
      - build/unit-8-gcp

permissions:
  contents: read

jobs:
  validate:
    name: Build, typecheck, test, and tenant isolation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cloudroute_app:cloudroute_ci_password@localhost:5432/cloudroute
      DATABASE_SSL: "false"
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudroute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Create non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d cloudroute -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE cloudroute_app LOGIN PASSWORD 'cloudroute_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;" \
            -c "ALTER DATABASE cloudroute OWNER TO cloudroute_app;" \
            -c "GRANT ALL ON SCHEMA public TO cloudroute_app;"
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Build workspace packages in dependency order
        run: pnpm build
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Run tests including PostgreSQL tenant isolation
        run: pnpm test
