name: CI

on:
  push:
    branches:
      - main
      - unit-1-foundation
      - build/units-2-7
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages in dependency order
        run: pnpm build
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
